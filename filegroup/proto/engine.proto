syntax = "proto3";

package filegroup.engine;

option go_package = "github.com/filegroup/proto/engine";

// ============================================================================
// Engine Service — Client-facing gRPC API
// Exposed on port 8443 with mTLS. All RPCs require x-api-key metadata.
// ============================================================================

service Engine {
    // Upload a new file or new version of an existing file
    rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
    rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);
    rpc WriteChunk(WriteChunkRequest) returns (WriteChunkResponse);
    rpc CompleteSession(CompleteSessionRequest) returns (CompleteSessionResponse);

    // Read a file
    rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
    rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);

    // File management
    rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
    rpc DeleteVersion(DeleteVersionRequest) returns (DeleteVersionResponse);
    rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
    rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
    rpc GetFileInfo(GetFileInfoRequest) returns (GetFileInfoResponse);

    // Table management
    rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
    rpc GetTables(GetTablesRequest) returns (GetTablesResponse);

    // Session management
    rpc CancelSession(CancelSessionRequest) returns (CancelSessionResponse);
}

// ============================================================================
// Enums
// ============================================================================

enum EncryptionAlgo {
    ENCRYPTION_NONE = 0;
    ENCRYPTION_AES_256_GCM = 1;
}

enum FileState {
    FILE_ACTIVE = 0;
    FILE_DELETED = 1;
}

enum VersionState {
    VERSION_UPLOADING = 0;
    VERSION_COMPLETE = 1;
    VERSION_SUPERSEDED = 2;
    VERSION_DELETED = 3;
    VERSION_EXPIRED = 4;
    VERSION_SESSION_TIMED_OUT = 5;
}

// ============================================================================
// OpenSession — Begin uploading a file
// ============================================================================

message OpenSessionRequest {
    uint32 group_id = 1;                        // File group ID
    uint32 table_id = 2;                        // Table ID
    uint64 logical_file_id = 3;                  // 0 = new file, non-zero = new version
    uint64 total_size = 4;                       // Expected total file size (0 = unknown)
    uint32 expected_chunks = 5;                  // 0 = unknown
    uint32 file_expires_in_days = 6;             // 0 = inherit from config
}

message OpenSessionResponse {
    uint64 session_id = 1;
    uint64 file_id = 2;
    uint64 logical_file_id = 3;
    uint32 version_number = 4;
    uint64 resolved_chunk_size = 5;              // Chunk size to use for writes
    uint32 expected_chunks = 6;                  // Computed if total_size known
    EncryptionAlgo encryption = 7;               // Resolved encryption algo
    string error = 8;
}

// ============================================================================
// WriteChunk — Write a single chunk of data
// ============================================================================

message WriteChunkRequest {
    uint64 session_id = 1;
    uint32 chunk_index = 2;
    bytes data = 3;                              // Plaintext (will be encrypted server-side if needed)
}

message WriteChunkResponse {
    bool success = 1;
    bool already_confirmed = 2;                  // True if idempotent retry
    string error = 3;
}

// ============================================================================
// CompleteSession — Finalize upload, file becomes readable
// ============================================================================

message CompleteSessionRequest {
    uint64 session_id = 1;
    uint32 content_checksum = 2;                 // CRC32C of full file plaintext (0 = skip check)
}

message CompleteSessionResponse {
    bool success = 1;
    uint64 logical_file_id = 2;
    uint64 file_id = 3;
    uint32 version_number = 4;
    string error = 5;
}

// ============================================================================
// ResumeSession — Resume an interrupted upload
// ============================================================================

message ResumeSessionRequest {
    uint64 session_id = 1;
}

message ResumeSessionResponse {
    uint64 session_id = 1;
    uint64 file_id = 2;
    uint64 logical_file_id = 3;
    uint32 version_number = 4;
    uint64 resolved_chunk_size = 5;
    repeated uint32 confirmed_chunks = 6;        // Already-written chunk indices
    EncryptionAlgo encryption = 7;
    string error = 8;
}

// ============================================================================
// ReadFile — Stream all chunks of a file
// ============================================================================

message ReadFileRequest {
    uint64 logical_file_id = 1;
    uint32 version_number = 2;                   // 0 = latest complete version
}

message ReadFileResponse {
    uint32 chunk_index = 1;
    bytes data = 2;                              // Plaintext chunk
    uint32 content_checksum = 3;                 // Full file CRC32C (sent with last chunk)
    bool is_last_chunk = 4;
    string error = 5;
}

// ============================================================================
// ReadChunk — Read a single chunk
// ============================================================================

message ReadChunkRequest {
    uint64 logical_file_id = 1;
    uint32 version_number = 2;
    uint32 chunk_index = 3;
}

message ReadChunkResponse {
    bytes data = 1;
    string error = 2;
}

// ============================================================================
// File/Version Management
// ============================================================================

message DeleteFileRequest {
    uint64 logical_file_id = 1;
}

message DeleteFileResponse {
    bool success = 1;
    string error = 2;
}

message DeleteVersionRequest {
    uint64 logical_file_id = 1;
    uint32 version_number = 2;
}

message DeleteVersionResponse {
    bool success = 1;
    string error = 2;
}

message ListFilesRequest {
    uint32 group_id = 1;
    uint32 table_id = 2;
    string page_token = 3;                       // Pagination token
    uint32 page_size = 4;                        // Max results
}

message FileInfo {
    uint64 logical_file_id = 1;
    uint32 table_id = 2;
    uint32 group_id = 3;
    uint32 latest_version = 4;
    FileState state = 5;
    uint64 total_size = 6;
    uint64 created_at_us = 7;
}

message ListFilesResponse {
    repeated FileInfo files = 1;
    string next_page_token = 2;
    string error = 3;
}

message ListVersionsRequest {
    uint64 logical_file_id = 1;
}

message VersionInfo {
    uint64 file_id = 1;
    uint32 version_number = 2;
    VersionState state = 3;
    uint64 total_size = 4;
    uint32 chunk_count = 5;
    uint64 expires_at_us = 6;
    EncryptionAlgo encryption = 7;
    uint64 created_at_us = 8;
}

message ListVersionsResponse {
    repeated VersionInfo versions = 1;
    string error = 2;
}

message GetFileInfoRequest {
    uint64 logical_file_id = 1;
}

message GetFileInfoResponse {
    FileInfo file = 1;
    VersionInfo latest_version = 2;
    string error = 3;
}

// ============================================================================
// Session Management
// ============================================================================

message CancelSessionRequest {
    uint64 session_id = 1;
}

message CancelSessionResponse {
    bool success = 1;
    string error = 2;
}

// ============================================================================
// Table Management
// ============================================================================

message CreateTableRequest {
    uint32 table_id = 1;
    uint32 group_id = 2;
    string name = 3;
    uint64 chunk_size = 4;           // 0 = inherit
    uint32 replication_factor = 5;    // 0 = inherit
    uint32 max_versions = 6;          // 0 = inherit
}

message CreateTableResponse {
    bool success = 1;
    string error = 2;
}

message GetTablesRequest {}

message TableInfo {
    uint32 table_id = 1;
    uint32 group_id = 2;
    string name = 3;
    uint64 chunk_size = 4;
    uint32 replication_factor = 5;
    EncryptionAlgo encryption = 6;
    uint32 max_versions = 7;
}

message GetTablesResponse {
    repeated TableInfo tables = 1;
    string error = 2;
}
