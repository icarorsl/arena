syntax = "proto3";

package filegroup.registry;

option go_package = "github.com/filegroup/proto/registry";

// ============================================================================
// Registry Service — Internal: Engine ↔ Registry (Raft cluster)
// mTLS-secured. Handles metadata consensus and file index queries.
// ============================================================================

service Registry {
    // Append a manifest entry — goes through Raft, returns LSN on commit
    rpc AppendEntry(AppendEntryRequest) returns (AppendEntryResponse);

    // File index queries
    rpc GetFile(GetFileRequest) returns (GetFileResponse);
    rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
    rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

    // Node health
    rpc ReportNodeHealth(ReportNodeHealthRequest) returns (ReportNodeHealthResponse);
    rpc GetClusterHealth(GetClusterHealthRequest) returns (GetClusterHealthResponse);

    // Raft-specific
    rpc GetLeader(GetLeaderRequest) returns (GetLeaderResponse);
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// ============================================================================
// AppendEntry — Write a manifest entry through Raft
// ============================================================================

message AppendEntryRequest {
    uint32 group_id = 1;
    uint32 entry_type = 2;                       // ManifestEntryType enum value
    bytes entry_body = 3;                        // Serialized manifest entry body
}

message AppendEntryResponse {
    bool success = 1;
    uint64 lsn = 2;                              // Committed log sequence number (0 on failure)
    string leader_address = 3;                   // Redirect if this node is not the leader
    string error = 4;
}

// ============================================================================
// GetFile — Query file metadata from the file index
// ============================================================================

message RegistryFileInfo {
    uint64 logical_file_id = 1;
    uint32 table_id = 2;
    uint32 group_id = 3;
    uint32 latest_complete_version = 4;
    uint32 next_version_number = 5;
    uint32 state = 6;                            // FileState enum
}

message GetFileRequest {
    uint64 logical_file_id = 1;
}

message GetFileResponse {
    RegistryFileInfo file = 1;
    string error = 2;
}

// ============================================================================
// ListFiles
// ============================================================================

message ListFilesRequest {
    uint32 group_id = 1;
    uint32 table_id = 2;
    string page_token = 3;
    uint32 page_size = 4;
}

message ListFilesResponse {
    repeated RegistryFileInfo files = 1;
    string next_page_token = 2;
    string error = 3;
}

// ============================================================================
// GetSession
// ============================================================================

message GetSessionRequest {
    uint64 session_id = 1;
}

message GetSessionResponse {
    uint64 session_id = 1;
    uint64 file_id = 2;
    uint32 state = 3;                            // VersionState enum
    repeated uint32 confirmed_chunks = 4;
    string error = 5;
}

// ============================================================================
// Node Health
// ============================================================================

enum RegistryNodeState {
    NODE_HEALTHY = 0;
    NODE_SUSPECT = 1;
    NODE_DEAD = 2;
}

message ReportNodeHealthRequest {
    uint32 node_id = 1;
    RegistryNodeState state = 2;
}

message ReportNodeHealthResponse {
    bool success = 1;
}

message GetClusterHealthRequest {}

message NodeHealthEntry {
    uint32 node_id = 1;
    RegistryNodeState state = 2;
    uint64 last_seen_us = 3;
}

message GetClusterHealthResponse {
    repeated NodeHealthEntry nodes = 1;
}

// ============================================================================
// Raft Protocol Messages
// ============================================================================

message GetLeaderRequest {}

message GetLeaderResponse {
    uint32 leader_node_id = 1;
    string leader_address = 2;
    bool is_leader = 3;
}

message RequestVoteRequest {
    uint64 term = 1;
    uint32 candidate_id = 2;
    uint64 last_log_index = 3;
    uint64 last_log_term = 4;
}

message RequestVoteResponse {
    uint64 term = 1;
    bool vote_granted = 2;
}

message LogEntry {
    uint64 term = 1;
    uint64 index = 2;
    uint32 entry_type = 3;                       // ManifestEntryType
    bytes data = 4;                              // Serialized manifest entry
}

message AppendEntriesRequest {
    uint64 term = 1;
    uint32 leader_id = 2;
    uint64 prev_log_index = 3;
    uint64 prev_log_term = 4;
    repeated LogEntry entries = 5;
    uint64 leader_commit = 6;
}

message AppendEntriesResponse {
    uint64 term = 1;
    bool success = 2;
    uint64 match_index = 3;                      // Highest log index replicated on this follower
}
